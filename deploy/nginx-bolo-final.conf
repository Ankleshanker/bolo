events {}

http {
  # Redirect HTTP to HTTPS — matrix.alisted.app
  server {
    listen 80;
    server_name matrix.alisted.app;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # Redirect HTTP to HTTPS — bolo.alisted.app
  server {
    listen 80;
    server_name bolo.alisted.app;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # HTTPS — Matrix client-server API
  server {
    listen 443 ssl;
    server_name matrix.alisted.app;

    ssl_certificate /etc/letsencrypt/live/matrix.alisted.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/matrix.alisted.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 50M;

    location /_synapse/admin/ {
        allow 127.0.0.1;
        deny all;
    }

    location /_matrix/federation/ {
        allow 127.0.0.1;
        deny all;
    }

    location / {
      proxy_pass http://synapse:8008;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Host $host;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 600;
    }
  }

  # HTTPS — Bolo game server (WebSocket)
  server {
    listen 443 ssl;
    server_name bolo.alisted.app;

    ssl_certificate /etc/letsencrypt/live/bolo.alisted.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bolo.alisted.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location / {
      # 127.0.0.11 = Docker's embedded DNS; defers bolo-server lookup to request
      # time so nginx can reload even when bolo-server is not running.
      resolver 127.0.0.11 valid=30s;
      set $bolo http://bolo-server:3000;
      proxy_pass $bolo;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 86400;
    }
  }
}

# Matrix federation port (8448)
stream {
  server {
    listen 8448 ssl;
    ssl_certificate /etc/letsencrypt/live/matrix.alisted.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/matrix.alisted.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    proxy_pass synapse:8008;
  }
}
